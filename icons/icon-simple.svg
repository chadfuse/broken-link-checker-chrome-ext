<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with brand color -->
  <circle cx="64" cy="64" r="60" fill="#4969f9" />
  
  <!-- Link icon -->
  <g transform="translate(64, 64)">
    <!-- Chain link shape -->
    <path d="M -15 -8 C -15 -15, -8 -15, 0 -15 L 8 -15 C 15 -15, 15 -8, 15 0 L 15 8 C 15 15, 8 15, 0 15 L -8 15 C -15 15, -15 8, -15 0" 
          stroke="white" stroke-width="5" fill="none" stroke-linecap="round"/>
    
    <!-- Broken indicator -->
    <circle cx="0" cy="0" r="8" fill="#ef4444"/>
    <line x1="-4" y1="-4" x2="4" y2="4" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <line x1="4" y1="-4" x2="-4" y2="4" stroke="white" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>