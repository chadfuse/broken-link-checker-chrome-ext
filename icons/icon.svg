<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4969f9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3a5ad8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#brandGradient)" />
  
  <!-- Chain link icon -->
  <g transform="translate(64, 64)">
    <!-- First link -->
    <path d="M -20 -10 C -20 -20, -10 -20, 0 -20 L 10 -20 C 20 -20, 20 -10, 20 0 L 20 10 C 20 20, 10 20, 0 20 L -10 20 C -20 20, -20 10, -20 0" 
          stroke="white" stroke-width="4" fill="none" stroke-linecap="round"/>
    
    <!-- Second link (interlocked) -->
    <path d="M -10 20 C -10 30, 0 30, 10 30 L 20 30 C 30 30, 30 20, 30 10 L 30 0 C 30 -10, 20 -10, 10 -10 L 0 -10 C -10 -10, -10 0, -10 10" 
          stroke="white" stroke-width="4" fill="none" stroke-linecap="round"/>
    
    <!-- Broken link indicator (red X) -->
    <g transform="rotate(45)">
      <line x1="-3" y1="-3" x2="3" y2="3" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
      <line x1="3" y1="-3" x2="-3" y2="3" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>
  
  <!-- Subtle shadow effect -->
  <ellipse cx="64" cy="120" rx="50" ry="8" fill="#000000" opacity="0.2"/>
</svg>