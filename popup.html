<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Broken Link Highlighter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      font-family: 'Open Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      font-family: 'Open Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      width: 280px;
      padding: 0;
      background: #1a1a1a;
      color: #e5e5e5;
      margin: 0;
      font-size: 11px;
    }

    .popup-header {
      background: linear-gradient(135deg, #4969f9 0%, #3a5ad8 100%);
      padding: 16px 12px 12px;
      text-align: center;
      border-bottom: 1px solid #374151;
    }

    .extension-title {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      margin: 0 0 4px 0;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
    }

    .extension-description {
      font-size: 9px;
      color: rgba(255, 255, 255, 0.9);
      margin: 0;
      line-height: 1.3;
      font-weight: 400;
    }

    .popup-content {
      padding: 12px;
    }

    .popup-footer {
      padding: 8px 12px;
      text-align: center;
      border-top: 1px solid #374151;
      background: #1f2937;
    }

    .developer-name {
      font-size: 8px;
      color: #9ca3af;
      margin: 0;
      font-weight: 400;
      font-style: italic;
    }

    button {
      width: 100%;
      padding: 8px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 8px;
      transition: all 0.2s ease;
    }

    #scanBtn {
      background: #4969f9;
      color: #ffffff;
    }

    #scanBtn:hover {
      background: #3a5ad8;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(73, 105, 249, 0.3);
    }

    #stopBtn {
      background: #ef4444;
      color: #ffffff;
    }

    #stopBtn:hover {
      background: #dc2626;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
    }

    #saveBtn {
      background: #6b7280;
      color: #ffffff;
      font-size: 11px;
      padding: 6px;
      font-weight: 500;
      margin-bottom: 10px;
    }

    #saveBtn:hover {
      background: #5b5f69;
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .section-group {
      margin-bottom: 12px;
    }

    .section-label {
      font-size: 10px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #d1d5db;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .custom-input {
      width: 100%;
      padding: 6px 10px;
      border: 1px solid #374151;
      border-radius: 6px;
      font-size: 11px;
      margin-top: 4px;
      background: #2d2d2d;
      color: #e5e5e5;
      transition: border-color 0.2s ease;
    }

    .custom-input:focus {
      outline: none;
      border-color: #4969f9;
      box-shadow: 0 0 0 2px rgba(73, 105, 249, 0.1);
    }

    .custom-input::placeholder {
      color: #9ca3af;
    }

    .save-status {
      font-size: 10px;
      color: #10b981;
      text-align: center;
      margin-top: 4px;
      opacity: 0;
      transition: opacity 0.3s ease;
      font-weight: 500;
    }

    .save-status.show {
      opacity: 1;
    }

    .scan-results {
      display: none;
      margin: 12px 0;
      padding: 12px;
      background: #1f2937;
      border-radius: 8px;
      border: 1px solid #374151;
    }

    .scan-results.active {
      display: block;
    }

    .results-title {
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 8px;
      text-align: center;
      color: #e5e5e5;
    }

    .results-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      font-size: 10px;
    }

    .result-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 3px 0;
    }

    .result-value {
      font-weight: 600;
    }

    .result-working { color: #10b981; }
    .result-broken { color: #ef4444; }
    .result-redirected { color: #f59e0b; }
    .result-errors { color: #9ca3af; }

    .scan-progress {
      display: none;
      margin: 12px 0;
      padding: 12px;
      background: #2d2d2d;
      border-radius: 8px;
      border: 1px solid #374151;
    }

    .scan-progress.active {
      display: block;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .progress-status {
      font-size: 11px;
      font-weight: 600;
      color: #e5e5e5;
    }

    .progress-current {
      font-size: 9px;
      color: #9ca3af;
      margin-bottom: 8px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .progress-bar-wrapper {
      width: 100%;
      height: 8px;
      background: #374151;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 6px;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: #4969f9;
      transition: width .3s ease;
      border-radius: 12px;
    }
  </style>
</head>

<body>

  <div class="popup-header">
    <h1 class="extension-title">Broken Link Highlighter</h1>
    <p class="extension-description">Quickly scan and highlight broken links with fast concurrent checking</p>
  </div>

  <div class="popup-content">

    <div class="section-group">
      <div class="section-label">Exclude CSS selectors</div>
      <input type="text" id="excludeSelectors" class="custom-input" placeholder="e.g., .admin, .debug, #comments">
    </div>

    <button id="saveBtn">Save Settings</button>
    <div class="save-status" id="saveStatus">Settings saved!</div>

    <button id="scanBtn">Scan Links</button>
    <button id="stopBtn" style="display: none;">Stop Scan</button>

    <div class="scan-results" id="scanResults">
      <div class="results-title">Scan Results</div>
      <div class="results-grid">
        <div class="result-item">
          <span>Total:</span>
          <span class="result-value" id="resultTotal">0</span>
        </div>
        <div class="result-item">
          <span>Working:</span>
          <span class="result-value result-working" id="resultWorking">0</span>
        </div>
        <div class="result-item">
          <span>Broken:</span>
          <span class="result-value result-broken" id="resultBroken">0</span>
        </div>
        <div class="result-item">
          <span>Redirected:</span>
          <span class="result-value result-redirected" id="resultRedirected">0</span>
        </div>
        <div class="result-item" style="grid-column: 1 / -1; text-align: center; margin-top: 6px; padding-top: 6px; border-top: 1px solid #374151;">
          <span>Errors:</span>
          <span class="result-value result-errors" id="resultErrors">0</span>
        </div>
      </div>
    </div>

    <div class="scan-progress" id="scanProgress">
      <div class="progress-header">
        <span class="progress-status" id="progressStatus">Starting scan...</span>
        <span id="progressPercent">0%</span>
      </div>
      <div class="progress-current" id="progressCurrent"></div>
      <div class="progress-bar-wrapper">
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </div>

  </div>

  <div class="popup-footer">
    <p class="developer-name"><small><a href="https://www.chadsia.com" style="color:grey;">Chad Sia Media</a> ©</small></p>
  </div>

  <script src="popup.js"></script>

</body>
</html>
